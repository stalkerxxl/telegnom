name: 🐛 Bug Report
description: Report a bug to help us improve Telegnom
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How did you encounter this bug? Please provide a minimal code example if possible.
      placeholder: |
        1. Run bot with ...
        2. Send message ...
        3. See error ...
    validations:
      required: true
  - type: input
    id: go_version
    attributes:
      label: Go Version
      placeholder: e.g., 1.25
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
