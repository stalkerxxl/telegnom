name: ✨ Feature Request
description: Suggest an idea for Telegnom
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe your idea
      description: What feature would you like to see and why?
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: How would this feature be used? Provide examples if possible.
    validations:
      required: true
