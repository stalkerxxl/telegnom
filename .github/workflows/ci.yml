#file: noinspection SpellCheckingInspection,SpellCheckingInspection,SpellCheckingInspection,SpellCheckingInspection,SpellCheckingInspection
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Go 1.25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Build
        # Убрали ".", так как в корне нет .go файлов
        run: go build -v ./bot/... ./types/... ./filters/...

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./bot/... ./types/... ./filters/...

  tidy:
    name: Check go mod tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Check tidy
        run: |
          go mod tidy
          git diff --exit-code

